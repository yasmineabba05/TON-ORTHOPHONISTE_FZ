  <div id="confetti-layer" class="confetti-layer" aria-hidden="true"></div>

<script>
(function(){
  "use strict";
  const rand = (min, max) => Math.random() * (max - min) + min;

  // Destination après l'animation : la page que le visiteur voulait ouvrir (sinon l'accueil)
  const PAGES = ["index.html", "accompagnements.html", "apropos.html", "avis.html", "contact.html"];
  const demandee = new URLSearchParams(location.search).get("next");
  const REDIRECT_URL = PAGES.includes(demandee) ? demandee : "index.html";
  // Clé vérifiée aussi dans le <script> en haut de chaque page du site.
  const SESSION_KEY = "loadingShown";

  // L'animation ne se joue qu'UNE SEULE FOIS par visite : on le note dès le début,
  // donc même un rechargement de cette page ne la rejoue pas.
  let dejaVue = false;
  try {
    dejaVue = !!sessionStorage.getItem(SESSION_KEY);
    sessionStorage.setItem(SESSION_KEY, "1");
  } catch (e) {}
  if (dejaVue) {
    window.location.replace(REDIRECT_URL);
    return;
  }

  const openingScene = document.getElementById('opening-scene');
  const welcomeScene = document.getElementById('welcome-scene');
  const bubble = document.getElementById('speech-bubble');
  const bubbleTyped = document.getElementById('bubble-typed');
  const bubbleCursor = document.querySelector('.bubble-cursor');
  const loaderFill = document.getElementById('loader-fill');
  const loaderLabel = document.getElementById('loader-label');
  const confettiLayer = document.getElementById('confetti-layer');

  const CONFETTI_COLORS = ['#FF9EBB', '#C6B6FF', '#8FE0C4', '#FFD873', '#FFD8E4'];

  function launchConfetti(count) {
    for (let i = 0; i < count; i++) {
      const piece = document.createElement('span');
      piece.className = 'confetti-piece';
      const left = rand(0, 100);
      const drift = rand(-60, 60);
      const dur = rand(1.8, 3.2);
      const delay = rand(0, 0.5);
      const rot = rand(320, 760);
      const color = CONFETTI_COLORS[Math.floor(rand(0, CONFETTI_COLORS.length))];
      const round = Math.random() > 0.5;
      piece.style.left = left + '%';
      piece.style.setProperty('--cf-x', drift + 'px');
      piece.style.setProperty('--cf-dur', dur + 's');
      piece.style.setProperty('--cf-delay', delay + 's');
      piece.style.setProperty('--cf-rot', rot + 'deg');
      piece.style.background = color;
      piece.style.borderRadius = round ? '50%' : '3px';
      confettiLayer.appendChild(piece);
      setTimeout(() => piece.remove(), (dur + delay + 0.3) * 1000);
    }
  }

  const GREETING = "Bonjour super héros, super héroïne ❤️ \nEs-tu prêt(e) pour une nouvelle aventure 🐰🌸";

  function typewrite(text, el, speed, onDone) {
    let i = 0;
    (function step() {
      if (i <= text.length) {
        el.textContent = text.slice(0, i);
        i++;
        setTimeout(step, speed + rand(-12, 20));
      } else {
        onDone && onDone();
      }
    })();
  }

  setTimeout(() => {
    bubble.classList.add('is-visible');
    typewrite(GREETING, bubbleTyped, 42, () => {
      bubbleCursor.classList.add('is-done');
    });
  }, 1000);

  let progress = 0;
  let transitionDone = false;

  function stepProgress() {
    let increment;
    if (progress < 30) increment = rand(1.5, 3.5);
    else if (progress < 70) increment = rand(2.5, 5);
    else increment = rand(3, 7);

    progress = Math.min(100, progress + increment);
    loaderFill.style.width = progress + '%';
    loaderLabel.textContent = Math.round(progress) + '%';

    if (progress < 100) {
      setTimeout(stepProgress, rand(180, 320));
    } else {
      setTimeout(transitionToWelcome, 400);
    }
  }

  function transitionToWelcome() {
    if (transitionDone) return;
    transitionDone = true;

    launchConfetti(36);

    bubble.classList.add('is-fading');
    bubble.classList.remove('is-visible');

    setTimeout(() => {
      openingScene.classList.remove('is-active');
      openingScene.setAttribute('aria-hidden', 'true');

      welcomeScene.classList.add('is-active');
      welcomeScene.setAttribute('aria-hidden', 'false');
    }, 600);
  }

  const startBtn = document.getElementById('start-btn');
  if (startBtn) {
    startBtn.addEventListener('click', function () {
      window.location.replace(REDIRECT_URL);
    });
  }

  setTimeout(stepProgress, 800);
})();
</script>
